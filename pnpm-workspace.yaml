packages:
  - 'packages/*'

# Dependencies allowed to run install scripts. Everything else installs
# without them, so a compromised package cannot run code at install time.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# The organization version baseline. Every LVBT repository's pnpm-workspace.yaml
# carries this same catalog (the generator writes it), so two repositories
# cannot drift onto different versions of one tool without it showing up as a
# change to a catalog. packages/repository-tooling/catalog.json is the source;
# a test fails if this block disagrees with it.
catalog:
  '@astrojs/check': 0.9.10
  '@astrojs/sitemap': 3.7.2
  '@cloudflare/vitest-pool-workers': 0.18.8
  '@cloudflare/workers-types': 4.20241205.0
  '@eslint-community/eslint-plugin-eslint-comments': 4.7.2
  '@eslint/js': 10.0.1
  '@playwright/test': 1.62.1
  '@tailwindcss/vite': 4.3.3
  '@types/node': 24.10.4
  '@types/react': 18.3.12
  '@types/react-dom': 18.3.1
  '@vitejs/plugin-react': 5.2.0
  astro: 6.3.5
  eslint: 10.9.1
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-sonarjs: 4.2.0
  eslint-plugin-turbo: 2.10.12
  globals: 17.12.0
  hono: 4.6.14
  lint-staged: 17.4.1
  markdownlint-cli2: 0.23.2
  markdownlint-rule-relative-links: 5.1.2
  prettier: 3.9.6
  prettier-plugin-astro: 0.14.1
  react: 18.3.1
  react-dom: 18.3.1
  tailwindcss: 4.3.3
  tsx: 4.23.1
  turbo: 2.10.12
  typescript: 6.0.3
  typescript-eslint: 8.69.0
  vite: 7.3.6
  vitest: 4.1.11
  wrangler: 4.127.1
  zod: 4.4.3

minimumReleaseAgeExclude:
  - globals@17.12.0
