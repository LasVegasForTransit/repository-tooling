# Publishes each example to its template repository
# (examples/basic to LasVegasForTransit/template-basic, and so on), so a new
# repository starts from GitHub's "Use this template" button (or
# `gh repo create <name> --template LasVegasForTransit/template-basic`) with no
# command line to remember. Runs on each release and by hand; the examples in
# this repository stay the single source.
#
# Needs a secret TEMPLATE_PUBLISH_TOKEN with contents and pull-request write
# access on the template repositories. Each repository remains protected by
# the organization ruleset and reviews the generated update before merging.
name: Publish template

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose example to publish (for example v0.2.0)
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish examples/${{ matrix.example }} to template-${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example: [basic, with-astro, with-vite-react]
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      EXAMPLE: ${{ matrix.example }}
    steps:
      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          path: source

      - name: Checkout the template repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LasVegasForTransit/template-${{ matrix.example }}
          token: ${{ secrets.TEMPLATE_PUBLISH_TOKEN }}
          path: template

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: source/package.json

      - name: Materialize the released template
        id: update
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Template publication requires a stable release tag." >&2
            exit 1
          fi
          node source/standards/template-publication.ts \
            --source source --target template --example "$EXAMPLE" --release "$TAG"
          cd template
          git switch -C "automation/repository-standard-${TAG}"
          pnpm install --lockfile-only --no-frozen-lockfile
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' \
            "chore: publish LVBT repository standard ${TAG}" \
            '' \
            "Refresh this template from the reviewed ${TAG} source." \
            > .git/lvbt-template-commit-message
          git restore --staged . && git add -A && \
            git -c user.name='lvbt-bot' -c user.email='noreply@lasvegasfortransit.org' \
              commit -F .git/lvbt-template-commit-message
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push publication branch
        if: steps.update.outputs.changed == 'true'
        shell: bash
        working-directory: template
        run: |
          set -euo pipefail
          BRANCH="automation/repository-standard-${TAG}"
          git push --force-with-lease --set-upstream origin "${BRANCH}"

      - name: Open template update for review
        if: steps.update.outputs.changed == 'true'
        shell: bash
        working-directory: template
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            '# TL;DR' \
            '' \
            "Updates this repository template to LVBT standard ${TAG}." \
            '' \
            '# Overview of Changes' \
            '' \
            "The files are generated from the reviewed ${TAG} example in repository-tooling." \
            '' \
            '# Follow-ups' \
            '' \
            'None.' \
            > .git/lvbt-template-pr.md
          HELPER=../source/packages/cli/plugins/lvbt-contributions/scripts/github-create.mjs
          TITLE="chore: publish LVBT repository standard ${TAG}"
          BRANCH="automation/repository-standard-${TAG}"
          node "$HELPER" pr \
            --title "$TITLE" \
            --body-file .git/lvbt-template-pr.md --base main --dry-run --json
          PR=$(gh pr list --head "$BRANCH" --base main --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$TITLE" --body-file .git/lvbt-template-pr.md
          else
            node "$HELPER" pr \
              --title "$TITLE" \
              --body-file .git/lvbt-template-pr.md --base main --json
          fi
