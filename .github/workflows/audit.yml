name: Run and reconcile shared audits

on:
  workflow_call:
    inputs:
      target:
        type: string
        default: production
      artifact-name:
        type: string
        default: lvbt-audit-report
      artifact-paths:
        type: string
        default: lvbt-audit-report.json
      link-checker:
        type: boolean
        default: false
      browser-directory:
        type: string
        default: ''
      build:
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  execute:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AUDIT_TARGET: ${{ inputs.target }}
      BROWSER_DIRECTORY: ${{ inputs.browser-directory }}
      PUBLIC_LVBT_INSTAGRAM: ${{ vars.PUBLIC_LVBT_INSTAGRAM }}
      PUBLIC_LVBT_LINKEDIN: ${{ vars.PUBLIC_LVBT_LINKEDIN }}
      PUBLIC_LVBT_BLUESKY: ${{ vars.PUBLIC_LVBT_BLUESKY }}
      PUBLIC_LVBT_DISCORD: ${{ vars.PUBLIC_LVBT_DISCORD }}
      PUBLIC_LVBT_DONATE_URL: ${{ vars.PUBLIC_LVBT_DONATE_URL }}
      PUBLIC_LVBT_MEMBERSHIP_FORM_URL: ${{ vars.PUBLIC_LVBT_MEMBERSHIP_FORM_URL }}
      PUBLIC_LVBT_NEWSLETTER_URL: ${{ vars.PUBLIC_LVBT_NEWSLETTER_URL }}
      PUBLIC_LVBT_NEWSLETTER_FEED_URL: ${{ vars.PUBLIC_LVBT_NEWSLETTER_FEED_URL }}
      PUBLIC_LVBT_CWA_TOKEN: ${{ vars.PUBLIC_LVBT_CWA_TOKEN }}
    steps:
      - name: Checkout executed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node + pnpm
        id: setup
        uses: ./.github/actions/setup-node-pnpm
      - name: Install product audit browser
        if: inputs.browser-directory != ''
        run: pnpm --dir "$BROWSER_DIRECTORY" exec playwright install --with-deps chromium
      - name: Build local audit inputs
        if: inputs.build
        run: pnpm build
      - name: Install pinned link checker
        if: success() && inputs.link-checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: --offline --no-progress 'https://example.com'
          fail: false
          jobSummary: false
      - name: Execute configured audits and retain every result
        if: success()
        run: pnpm run audit --target "$AUDIT_TARGET" --json --output lvbt-audit-report.json
      - name: Retain normalized and raw evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          overwrite: true
          path: |
            lvbt-audit-report.json
            ${{ inputs.artifact-paths }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  report:
    needs: execute
    if: >-
      always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
      actions: read
      issues: write
    concurrency:
      group: audit-reconcile-${{ github.repository }}-${{ inputs.target }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Download this run's evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: audit-evidence
      - name: Preview verified contribution-helper actions
        run: pnpm run audit report --input audit-evidence/lvbt-audit-report.json --dry-run --json
      - name: Reconcile verified findings
        run: pnpm run audit report --input audit-evidence/lvbt-audit-report.json --json
