# Checks every repository in standards/repositories.json against the latest
# release and the organization settings, and fails when one has drifted:
# behind the latest release for more than three days, an unreleased vendored
# commit on main, a failing update pull request, a stale plugin ref, a missing
# org-standard ruleset, or a repository that cannot update itself. The job
# summary lists every repository. A documented, unexpired exception in
# repositories.json silences one rule for one repository. Every repository is
# public, so the workflow's own token reads everything it needs.
name: Standard status

on:
  schedule:
    - cron: '47 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  status:
    name: Check repositories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Report drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: node standards/status.ts
