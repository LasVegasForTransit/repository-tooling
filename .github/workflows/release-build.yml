name: Build retained staging release

on:
  workflow_call:
    inputs:
      release-tag:
        description: Reviewed application version tag, supplied by its release workflow
        type: string
        required: false
      app:
        type: string
        required: false
      artifact-source:
        description: cf-output, typed-worker, or legacy-worker, matching the selected release config
        type: string
        required: false
        default: cf-output
      require-analytics:
        type: boolean
        required: false
        default: false
      build-environment:
        description: Existing environment containing public application build variables
        type: string
        required: false
      app-directory:
        type: string
        required: true
      validation-browser-directory:
        type: string
        required: false
      artifact-prefix:
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    if: inputs.build-environment == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: &build-environment
      LVBT_RELEASE_APP: ${{ inputs.app }}
      LVBT_RELEASE_TAG: ${{ inputs.release-tag }}
      PUBLIC_LVBT_INSTAGRAM: ${{ vars.PUBLIC_LVBT_INSTAGRAM }}
      PUBLIC_LVBT_LINKEDIN: ${{ vars.PUBLIC_LVBT_LINKEDIN }}
      PUBLIC_LVBT_BLUESKY: ${{ vars.PUBLIC_LVBT_BLUESKY }}
      PUBLIC_LVBT_DISCORD: ${{ vars.PUBLIC_LVBT_DISCORD }}
      PUBLIC_LVBT_DONATE_URL: ${{ vars.PUBLIC_LVBT_DONATE_URL }}
      PUBLIC_LVBT_MEMBERSHIP_FORM_URL: ${{ vars.PUBLIC_LVBT_MEMBERSHIP_FORM_URL }}
      PUBLIC_LVBT_NEWSLETTER_URL: ${{ vars.PUBLIC_LVBT_NEWSLETTER_URL }}
      PUBLIC_LVBT_NEWSLETTER_FEED_URL: ${{ vars.PUBLIC_LVBT_NEWSLETTER_FEED_URL }}
      PUBLIC_LVBT_LABS_CWA_TOKEN: ${{ vars.PUBLIC_LVBT_LABS_CWA_TOKEN }}
      COMPARE_PUBLISHED: ${{ vars.COMPARE_PUBLISHED }}
      PUBLIC_LVBT_CWA_TOKEN: ${{ vars.PUBLIC_LVBT_CWA_TOKEN }}
      LVBT_REQUIRE_ANALYTICS: ${{ inputs.require-analytics && '1' || '' }}
      LVBT_PRODUCTION_URL: ${{ vars.LVBT_PRODUCTION_URL }}
      LVBT_PREVIEW_URL: ${{ vars.LVBT_PREVIEW_URL }}
      LVBT_PREVIEW_BINDINGS: ${{ vars.LVBT_PREVIEW_BINDINGS }}
      RELEASE_ID: ${{ github.run_id }}
      APP_DIRECTORY: ${{ inputs.app-directory }}
      VALIDATION_BROWSER_DIRECTORY: ${{ inputs.validation-browser-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          lfs: true
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Build and retain reviewed release
        uses: ./.lvbt/web-platform/packages/web-platform/actions/release-build
        with:
          artifact-source: ${{ inputs.artifact-source }}
          artifact-prefix: ${{ inputs.artifact-prefix }}
  build-with-environment:
    if: inputs.build-environment != ''
    environment: ${{ inputs.build-environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: *build-environment
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          lfs: true
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Build and retain reviewed release
        uses: ./.lvbt/web-platform/packages/web-platform/actions/release-build
        with:
          artifact-source: ${{ inputs.artifact-source }}
          artifact-prefix: ${{ inputs.artifact-prefix }}
