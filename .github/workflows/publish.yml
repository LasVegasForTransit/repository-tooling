# Publishes every packages/* to GitHub Packages. Manual only: consumers install
# from git tags by default, and nothing is published without the maintainer
# choosing to run this.
name: Publish packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish (for example v0.2.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Check
        run: pnpm check

      - name: Publish
        run: pnpm -r publish --no-git-checks --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_registry: https://npm.pkg.github.com
