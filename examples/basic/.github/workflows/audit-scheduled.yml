name: Audit (scheduled)

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  issues: write

concurrency:
  group: shared-audits-${{ github.repository }}
  cancel-in-progress: false

jobs:
