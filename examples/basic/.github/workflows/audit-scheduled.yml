name: Audit (scheduled)

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  issues: write

concurrency:
  group: shared-audits-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    uses: LasVegasForTransit/repository-tooling/.github/workflows/audit.yml@b49317453a9e1d9ce2feda157a05782f803200d6
